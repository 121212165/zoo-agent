<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>红山动物园 · 智能陪逛</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <div class="phone-frame">
            <header class="app-header">
                <div class="header-content">
                    <div class="logo-area">
                        <span class="logo-emoji">🐾</span>
                        <div class="logo-text">
                            <h1>红山陪逛</h1>
                            <span class="subtitle">懂红山·懂动物·更懂你</span>
                        </div>
                    </div>
                    <button class="icon-btn" id="infoBtn" title="关于">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 16v-4M12 8h.01"/>
                        </svg>
                    </button>
                </div>
            </header>

            <nav class="tab-nav">
                <button class="tab-btn active" data-tab="chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span>陪逛</span>
                </button>
                <button class="tab-btn" data-tab="map">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
                    <span>地图</span>
                </button>
                <button class="tab-btn" data-tab="route">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span>路线</span>
                </button>
                <button class="tab-btn" data-tab="animals">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                    <span>动物</span>
                </button>
            </nav>

            <main class="content-area">
                <section class="tab-content active" id="tab-chat">
                    <div class="chat-container" id="chatContainer">
                        <div class="message assistant welcome-msg">
                            <div class="avatar">
                                <span>🐾</span>
                            </div>
                            <div class="msg-content">
                                <div class="msg-bubble" id="welcomeBubble">
                                    正在加载...
                                </div>
                                <div class="quick-questions" id="quickQuestions"></div>
                            </div>
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <button class="voice-btn" id="voiceBtn" title="语音输入">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" y1="19" x2="12" y2="23"/>
                                <line x1="8" y1="23" x2="16" y2="23"/>
                            </svg>
                        </button>
                        <div class="input-wrapper">
                            <input type="text" id="chatInput" placeholder="问我任何关于红山的问题..." autocomplete="off">
                        </div>
                        <button class="send-btn" id="sendBtn">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                        </button>
                    </div>

                    <div class="voice-overlay" id="voiceOverlay">
                        <div class="voice-modal">
                            <div class="voice-wave" id="voiceWave">
                                <span></span><span></span><span></span><span></span><span></span>
                                <span></span><span></span><span></span><span></span><span></span>
                            </div>
                            <p class="voice-tip" id="voiceTip">正在听你说话...</p>
                            <button class="voice-close" id="voiceClose">取消</button>
                        </div>
                    </div>
                </section>

                <section class="tab-content" id="tab-map">
                    <div class="map-container">
                        <svg id="zooMap" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid meet">
                            <defs>
                                <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#e8f5e9"/>
                                    <stop offset="100%" style="stop-color:#c8e6c9"/>
                                </linearGradient>
                                <filter id="shadow">
                                    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
                                </filter>
                            </defs>
                            <rect width="600" height="450" fill="url(#bgGrad)" rx="0"/>
                            <path d="M80 50 L520 50 L520 430 L80 430 Z" fill="#a5d6a7" opacity="0.4" rx="20"/>
                            <path d="M0 380 Q150 350 300 390 Q450 430 600 380 L600 450 L0 450 Z" fill="#81c784" opacity="0.3"/>
                            <path d="M0 0 Q200 30 350 0 Q500 -20 600 10 L600 60 Q400 40 200 60 Q100 70 0 50 Z" fill="#a5d6a7" opacity="0.3"/>
                            <g id="mapElements"></g>
                            <g id="routeLayer"></g>
                            <g id="userMarker" style="display:none">
                                <circle cx="200" cy="30" r="8" fill="#4CAF50" stroke="white" stroke-width="3"/>
                                <circle cx="200" cy="30" r="14" fill="#4CAF50" opacity="0.3">
                                    <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite"/>
                                    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
                                </circle>
                            </g>
                        </svg>
                        <div class="map-legend">
                            <div class="legend-item"><span class="dot t0"></span>T0必看</div>
                            <div class="legend-item"><span class="dot t1"></span>T1推荐</div>
                            <div class="legend-item"><span class="dot t2"></span>T2可选</div>
                        </div>
                        <div class="map-facilities">
                            <button class="facility-toggle active" data-type="all">全部</button>
                            <button class="facility-toggle" data-type="restroom">🚻</button>
                            <button class="facility-toggle" data-type="restaurant">🍴</button>
                            <button class="facility-toggle" data-type="rest_area">🪑</button>
                        </div>
                    </div>
                    <div class="venue-card" id="venueCard" style="display:none">
                        <div class="venue-card-content">
                            <h3 id="venueCardTitle"></h3>
                            <p id="venueCardDesc"></p>
                            <div class="venue-card-actions">
                                <button class="btn-secondary" id="closeVenueCard">关闭</button>
                                <button class="btn-primary" id="guideToVenue">听讲解</button>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="tab-content" id="tab-route">
                    <div class="route-planner">
                        <h2>🗺️ 智能路线规划</h2>
                        <div class="form-group">
                            <label>游览时长</label>
                            <div class="option-group">
                                <button class="option-btn" data-duration="2">2小时</button>
                                <button class="option-btn active" data-duration="4">4小时</button>
                                <button class="option-btn" data-duration="6">全天</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>同行人员</label>
                            <div class="option-group">
                                <button class="option-btn" data-flag="with_kids">👶 带娃</button>
                                <button class="option-btn" data-flag="with_elderly">👴 老人</button>
                                <button class="option-btn" data-flag="avoid_slopes">🚫 不爬山</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>感兴趣的动物</label>
                            <div class="option-group">
                                <button class="option-btn" data-pref="猛兽">🐯 猛兽大猫</button>
                                <button class="option-btn" data-pref="灵长类">🐵 灵长类</button>
                                <button class="option-btn" data-pref="鸟类">🦜 鸟类</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>入口选择</label>
                            <div class="option-group">
                                <button class="option-btn active" data-entrance="south">🆕 南门（新区，坡缓）</button>
                                <button class="option-btn" data-entrance="north">🚇 北门（地铁直达）</button>
                                <button class="option-btn" data-entrance="east">🚪 东门</button>
                            </div>
                        </div>
                        <button class="btn-primary btn-full" id="planRouteBtn">✨ 生成我的专属路线</button>

                        <div class="route-result" id="routeResult" style="display:none">
                            <h3>📍 为你推荐的路线</h3>
                            <div id="routeText" class="route-text"></div>
                            <div class="route-stats" id="routeStats"></div>
                        </div>
                    </div>
                </section>

                <section class="tab-content" id="tab-animals">
                    <div class="animals-header">
                        <h2>🐾 红山动物明星</h2>
                        <div class="filter-tabs">
                            <button class="filter-btn active" data-filter="all">全部</button>
                            <button class="filter-btn" data-filter="star">⭐明星</button>
                            <button class="filter-btn" data-filter="popular">🔥人气</button>
                            <button class="filter-btn" data-filter="special">💫故事</button>
                        </div>
                    </div>
                    <div class="animals-grid" id="animalsGrid"></div>
                </section>
            </main>
        </div>

        <div class="modal-overlay" id="infoModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>关于红山陪逛</h3>
                    <button class="modal-close" id="closeInfoModal">&times;</button>
                </div>
                <div class="modal-body">
                    <p><strong>红山森林动物园</strong></p>
                    <p>📍 南京市玄武区和燕路168号</p>
                    <p>⏰ 开放时间：8:30-16:30</p>
                    <p>🎫 成人票70元，学生半价</p>
                    <p style="margin-top:16px">中国首家取消动物表演的动物园（2011年），以动物福利为底线的城市动物园。</p>
                    <p style="margin-top:12px;font-size:12px;color:#888">本应用为赛事开发的智能陪逛Agent演示版，所有动物故事基于红山真实公开资料。</p>
                </div>
            </div>
        </div>

        <div class="animal-detail-modal" id="animalModal" style="display:none">
            <div class="animal-detail-content">
                <button class="animal-detail-close" id="closeAnimalModal">&times;</button>
                <div class="animal-detail-header">
                    <span class="animal-big-emoji" id="animalEmoji"></span>
                    <h2 id="animalName"></h2>
                    <p class="animal-names" id="animalNames"></p>
                </div>
                <div class="animal-detail-body">
                    <div class="animal-info-row">
                        <span class="info-label">📍 展区</span>
                        <span id="animalVenue"></span>
                    </div>
                    <div class="animal-info-row">
                        <span class="info-label">⏰ 活跃时间</span>
                        <span id="animalFeedTime"></span>
                    </div>
                    <div class="animal-story">
                        <h4>它们的故事</h4>
                        <p id="animalStory"></p>
                    </div>
                </div>
                <button class="btn-primary btn-full" id="askAboutAnimal">和我聊聊它</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
